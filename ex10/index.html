<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EX10 - Shopping Cart</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
<h1>Carrinho de compras</h1>
        <label for="produto">Produto:</label>
        <select id="produto">
            <option value="Rato|15">Rato - 15 €</option>
            <option value="Teclado|25">Teclado - 25 €</option>
            <option value="Monitor|180">Monitor - 180 €</option>
        </select>
        <button id="adicionar">Adicionar ao carrinho</button>
        <section id="carrinho"></section>
        <button id="limpar">Limpar carrinho</button>
        <script src="script.js"></script>
    </body>
</html>
